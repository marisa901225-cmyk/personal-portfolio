  llama-server-light:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: myasset-llm-light
    restart: always
    ports:
      - "8081:8081"
    volumes:
      - /home/dlckdgn/ai-models:/data:ro
    environment:
      - TZ=Asia/Seoul
    command: >
      --model /data/Qwen3-0.6B-Q8_0.gguf --host 0.0.0.0 --port 8081 --ctx-size 2048 --threads 2
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - appnet

  llama-server-vulkan-huihui:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: myasset-llm-vulkan-huihui
    profiles:
      - vulkan
    restart: unless-stopped
    ports:
      - "8083:8083"
    volumes:
      - /home/dlckdgn/ai-models:/data:ro
      - ./backend/data/llm_model_path_vulkan_huihui.txt:/data/__llama_server_vulkan_huihui__.txt
      - ./backend/scripts/shell/run_llm_server.sh:/run.sh:ro
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=Asia/Seoul
      - LLM_MODEL_PATH=/data/gemma-4-E2B-it-Q8_0.gguf
      - LLM_MODEL_PATH_FILE=/data/__llama_server_vulkan_huihui__.txt
      - LLM_THREADS=6
      - LLM_N_GPU_LAYERS=all
      - LLM_SERVER_PORT=8083
      - LLM_CTX_SIZE=6144
      - LLM_PARALLEL=1
      - LLM_USE_MODEL_BUILTIN_TEMPLATE=1
      - LLM_DEVICE=Vulkan0
      - LLM_FLASH_ATTN=on
      - LLM_CACHE_TYPE_K=q4_0
      - LLM_CACHE_TYPE_V=q4_0
      - LLM_MMPROJ_PATH=/data/mmproj-gemma-4-E2B-it-Q8_0.gguf
    entrypoint: [ "/bin/bash", "/run.sh" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - appnet

  llama-server-sycl-huihui:
    image: ghcr.io/ggml-org/llama.cpp:server-intel
    container_name: myasset-llm-sycl-huihui
    restart: unless-stopped
    ports:
      - "8084:8084"
    volumes:
      - /home/dlckdgn/ai-models:/data:ro
      - ./backend/data/llm_model_path_vulkan_huihui.txt:/config/llm_model_path_sycl_huihui.txt:ro
      - ./backend/scripts/shell/run_llm_server.sh:/run.sh:ro
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=Asia/Seoul
      - LLM_MODEL_PATH=/data/gemma-4-E2B-it-Q8_0.gguf
      - LLM_THREADS=6
      - LLM_N_GPU_LAYERS=all
      - LLM_SERVER_PORT=8084
      - LLM_CTX_SIZE=65000
      - LLM_PARALLEL=1
      - LLM_USE_MODEL_BUILTIN_TEMPLATE=1
      - LLM_DEVICE=SYCL0
      - LLM_MODEL_PATH_FILE=/config/llm_model_path_sycl_huihui.txt
      - LLM_FLASH_ATTN=on
      - LLM_CACHE_TYPE_K=q4_0
      - LLM_CACHE_TYPE_V=q4_0
      - LLM_MMPROJ_PATH=/data/mmproj-gemma-4-E2B-it-Q8_0.gguf
      - LLM_EXTRA_ARGS=--no-warmup
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - GGML_SYCL_FORCE_MMQ=1
      - ZES_ENABLE_SYSMAN=1
    entrypoint: [ "/bin/bash", "/run.sh" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - appnet

  comfyui:
    build:
      context: ./comfyui
      dockerfile: Dockerfile
    container_name: myasset-comfyui
    restart: unless-stopped
    ports:
      - "0.0.0.0:8188:8188"
    volumes:
      - /home/dlckdgn/ai-models/ComfyUI/models:/opt/ComfyUI/models
      - /mnt/one-touch/comfyui/input:/opt/ComfyUI/input
      - /mnt/one-touch/comfyui/output:/opt/ComfyUI/output
      - /mnt/one-touch/comfyui/user:/opt/ComfyUI/user
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=Asia/Seoul
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - SYCL_CACHE_PERSISTENT=1
      - PYTORCH_ENABLE_XPU_FALLBACK=1
      - ZES_ENABLE_SYSMAN=1
    command: python main.py --listen 0.0.0.0 --port 8188
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8188/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - appnet

  comfyui-gdrive-sync:
    image: *comfyui_gdrive_sync_image
    build:
      context: ./backend
      dockerfile: Dockerfile.gdrive-sync
    container_name: myasset-comfyui-gdrive-sync
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./backend/data:/app/backend/data
      - ${MYASSET_SECRETS_ENV_FILE:-/home/dlckdgn/ai-models/myasset.secrets.env}:/app/runtime/myasset.secrets.env
      - /mnt/one-touch/comfyui/output:/comfyui-output:ro
    command: python -m backend.scripts.comfyui_drive_sync
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Seoul
      - MYASSET_SECRETS_ENV_FILE=/app/runtime/myasset.secrets.env
      - COMFYUI_OUTPUT_DIR=/comfyui-output
      - COMFYUI_GDRIVE_SYNC_STATE_PATH=/app/backend/data/comfyui_gdrive_sync_state.json
      - COMFYUI_GDRIVE_FOLDER_NAME=${COMFYUI_GDRIVE_FOLDER_NAME:-Comfyui 이미지}
      - COMFYUI_GDRIVE_FOLDER_ID=${COMFYUI_GDRIVE_FOLDER_ID:-}
      - COMFYUI_GDRIVE_POLL_INTERVAL_SEC=${COMFYUI_GDRIVE_POLL_INTERVAL_SEC:-30}
      - COMFYUI_GDRIVE_STABLE_AGE_SEC=${COMFYUI_GDRIVE_STABLE_AGE_SEC:-15}
    env_file: *backend_env_files
    depends_on:
      comfyui:
        condition: service_started
    networks:
      - appnet

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=Asia/Seoul

  homeassistant-cli:
    build:
      context: ./docker/homeassistant-cli
      dockerfile: Dockerfile
    container_name: homeassistant-cli
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Asia/Seoul
    env_file:
      - ./backend/.env
    depends_on:
      - homeassistant

  # openvino-server:
  #   build:
  #     context: ./backend/openvino_server
  #     dockerfile: Dockerfile
  #   container_name: myasset-openvino-llm
  #   restart: always
  #   profiles:
  #     - manual
  #   ports:
  #     - "8082:8082"
  #   volumes:
  #     - /home/dlckdgn/ai-models/openvino/Josiefied-Qwen3-8B-int8:/models/Josiefied-Qwen3-8B-int8:ro
  #   devices:
  #     - /dev/dri:/dev/dri
  #   environment:
  #     - OV_MODEL_DIR=/models/Josiefied-Qwen3-8B-int8
  #     - OV_MODEL_ID=Josiefied-Qwen3-8B-int8
  #     - OV_DEVICE=GPU
  #     - TZ=Asia/Seoul
  #   healthcheck:
  #     test: [ "CMD", "curl", "-f", "http://localhost:8082/health" ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 120s
  #   networks:
  #     - appnet

  backend-api:
    image: *backend_image
    build: *backend_build
    container_name: myasset-backend-api
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./backend/storage:/app/backend/storage
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
      - ${KIS_CONFIG_DIR:-/home/dlckdgn/KIS/config}:/root/KIS/config
      - /mnt/one-touch:/mnt/one-touch
      - /mnt/one-touch/comfyui/output:/comfyui-output:ro
      - /var/run/docker.sock:/var/run/docker.sock
    devices:
      - /dev/dri:/dev/dri
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      - LLM_BASE_URL=http://llama-server-sycl-huihui:8084
      - LLM_REMOTE_DEFAULT_MODEL=supergemma4-Q8_0.gguf
      - COMFYUI_BASE_URL=http://comfyui:8188
      - COMFYUI_OUTPUT_DIR=/comfyui-output
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - TELEGRAM_JELLYFIN_CONTAINER_NAME=jellyfin
      - TELEGRAM_JELLYFIN_COMPOSE_PROJECT=my-home-server
      - TELEGRAM_JELLYFIN_COMPOSE_SERVICE=jellyfin
      - TELEGRAM_DOCKER_SOCKET_PATH=/var/run/docker.sock
      - TZ=Asia/Seoul
    env_file: *backend_env_files
    # depends_on:
    #   llama-server:
    #     condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - appnet

  alarm-collector:
    image: *backend_image
    container_name: myasset-alarm-collector
    restart: always
    ports:
      - "0.0.0.0:8001:8001"
    volumes:
      - ./backend:/app/backend
      - ./backend/storage:/app/backend/storage
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
      - ${KIS_CONFIG_DIR:-/home/dlckdgn/KIS/config}:/root/KIS/config
      - /mnt/one-touch:/mnt/one-touch
    command: python -m backend.scripts.manage run-collector --host 0.0.0.0 --port 8001
    environment:
      - PYTHONPATH=/app
      - LLM_BASE_URL=http://llama-server-sycl-huihui:8084
      - LLM_REMOTE_DEFAULT_MODEL=supergemma4-Q8_0.gguf
      - TZ=Asia/Seoul
    env_file: *backend_env_files
    # depends_on:
    #   llama-server:
    #     condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - appnet

  news-scheduler:
    image: *backend_image
    container_name: myasset-news-scheduler
    restart: always
    volumes:
      - ./backend:/app/backend
      - ./backend/storage:/app/backend/storage
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
      - ${MYASSET_SECRETS_ENV_FILE:-/home/dlckdgn/ai-models/myasset.secrets.env}:/app/runtime/myasset.secrets.env
      - ${KIS_CONFIG_DIR:-/home/dlckdgn/KIS/config}:/root/KIS/config
      - /mnt/one-touch:/mnt/one-touch
    command: python -m backend.scripts.manage run-scheduler
    environment:
      - PYTHONPATH=/app
      - LLM_BASE_URL=http://llama-server-sycl-huihui:8084
      - LLM_REMOTE_DEFAULT_MODEL=supergemma4-Q8_0.gguf
      - TZ=Asia/Seoul
      - SCHEDULER_ROLE=news
      - MYASSET_SECRETS_ENV_FILE=/app/runtime/myasset.secrets.env
      - TRADING_ENGINE_ENABLED=0
      - BACKEND_AUTH_ROTATE_ENABLED=${BACKEND_AUTH_ROTATE_ENABLED:-1}
      - BACKEND_AUTH_ROTATE_INTERVAL_DAYS=${BACKEND_AUTH_ROTATE_INTERVAL_DAYS:-60}
      - BACKEND_AUTH_ROTATE_CHECK_HOUR=${BACKEND_AUTH_ROTATE_CHECK_HOUR:-4}
      - BACKEND_AUTH_ROTATE_CHECK_MINUTE=${BACKEND_AUTH_ROTATE_CHECK_MINUTE:-17}
      - BACKEND_AUTH_ROTATE_SKIP_INITIAL=${BACKEND_AUTH_ROTATE_SKIP_INITIAL:-1}
      - BACKEND_AUTH_ROTATE_RESTART_HINT_SERVICES=${BACKEND_AUTH_ROTATE_RESTART_HINT_SERVICES:-backend-api alarm-collector}
      - BACKEND_AUTH_ROTATE_STATE_PATH=${BACKEND_AUTH_ROTATE_STATE_PATH:-backend/data/auth_secret_rotation_state.json}
    env_file: *backend_env_files
    # depends_on:
    #   llama-server:
    #     condition: service_healthy
    networks:
      - appnet
    # Resource limits: Crawler + scheduler (moderate CPU during scraping)
    cpus: "1.0"
    mem_limit: "512m"
    pids_limit: 300

  trading-scheduler:
    image: *backend_image
    container_name: myasset-trading-scheduler
    restart: always
    volumes:
      - ./backend:/app/backend
      - ./backend/storage:/app/backend/storage
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
      - ${MYASSET_SECRETS_ENV_FILE:-/home/dlckdgn/ai-models/myasset.secrets.env}:/app/runtime/myasset.secrets.env
      - ${KIS_CONFIG_DIR:-/home/dlckdgn/KIS/config}:/root/KIS/config
      - /mnt/one-touch:/mnt/one-touch
    command: python -m backend.scripts.manage run-scheduler
    environment:
      - PYTHONPATH=/app
      - LLM_BASE_URL=http://llama-server-sycl-huihui:8084
      - LLM_REMOTE_DEFAULT_MODEL=supergemma4-Q8_0.gguf
      - TZ=Asia/Seoul
      - SCHEDULER_ROLE=trading
      - MYASSET_SECRETS_ENV_FILE=/app/runtime/myasset.secrets.env
      - TRADING_ENGINE_ENABLED=1
      - TRADING_ENGINE_API_FACTORY=${TRADING_ENGINE_API_FACTORY:-backend.integrations.kis.trading_adapter:create_trading_api}
      - TRADING_ENGINE_SCHEDULE_INTERVAL_MIN=${TRADING_ENGINE_SCHEDULE_INTERVAL_MIN:-2}
      - TRADING_ENGINE_INCLUDE_ETF=${TRADING_ENGINE_INCLUDE_ETF:-1}
      - TRADING_ENGINE_USE_KOSDAQ_CONFIRMATION=${TRADING_ENGINE_USE_KOSDAQ_CONFIRMATION:-1}
      - TRADING_ENGINE_REGIME_VOL_THRESHOLD=${TRADING_ENGINE_REGIME_VOL_THRESHOLD:-0.05}
      - TRADING_ENGINE_STATE_PATH=${TRADING_ENGINE_STATE_PATH:-backend/storage/trading_engine/state.json}
      - TRADING_ENGINE_OUTPUT_DIR=${TRADING_ENGINE_OUTPUT_DIR:-backend/storage/trading_engine/output}
      - TRADING_ENGINE_RUNLOG_PATH=${TRADING_ENGINE_RUNLOG_PATH:-backend/storage/trading_engine/runlog_current.log}
      - TRADING_ENGINE_MAX_DAY_ENTRIES_PER_DAY=${TRADING_ENGINE_MAX_DAY_ENTRIES_PER_DAY:-16}
      - TRADING_ENGINE_DAY_ENTRY_BUDGET_CAP_KRW=${TRADING_ENGINE_DAY_ENTRY_BUDGET_CAP_KRW:-300000}
      - TRADING_ENGINE_DAY_REUSE_UNUSED_SWING_CASH_ENABLED=${TRADING_ENGINE_DAY_REUSE_UNUSED_SWING_CASH_ENABLED:-1}
      - TRADING_ENGINE_DAY_REUSE_UNUSED_SWING_CASH_MIN_KRW=${TRADING_ENGINE_DAY_REUSE_UNUSED_SWING_CASH_MIN_KRW:-0}
      - TRADING_ENGINE_DAY_CONDITIONAL_EXTRA_ENTRIES_ENABLED=${TRADING_ENGINE_DAY_CONDITIONAL_EXTRA_ENTRIES_ENABLED:-1}
      - TRADING_ENGINE_DAY_CONDITIONAL_EXTRA_ENTRIES=${TRADING_ENGINE_DAY_CONDITIONAL_EXTRA_ENTRIES:-1}
      - TRADING_ENGINE_DAY_CONDITIONAL_EXTRA_MIN_CLOSED_TRADES=${TRADING_ENGINE_DAY_CONDITIONAL_EXTRA_MIN_CLOSED_TRADES:-0}
      - TRADING_ENGINE_DAY_CONDITIONAL_EXTRA_MIN_WIN_RATE=${TRADING_ENGINE_DAY_CONDITIONAL_EXTRA_MIN_WIN_RATE:-0}
      - TRADING_ENGINE_DAY_CONDITIONAL_EXTRA_MIN_REALIZED_PNL=${TRADING_ENGINE_DAY_CONDITIONAL_EXTRA_MIN_REALIZED_PNL:-0}
      - TRADING_ENGINE_DAY_CONDITIONAL_EXTRA_MAX_CONSECUTIVE_LOSSES=${TRADING_ENGINE_DAY_CONDITIONAL_EXTRA_MAX_CONSECUTIVE_LOSSES:-0}
      - TRADING_ENGINE_DAY_CONDITIONAL_EXTRA_MIN_ORDER_AMOUNT_KRW=${TRADING_ENGINE_DAY_CONDITIONAL_EXTRA_MIN_ORDER_AMOUNT_KRW:-100000}
      - TRADING_ENGINE_RISK_OFF_PARKING_CODE=${TRADING_ENGINE_RISK_OFF_PARKING_CODE:-0048J0}
    env_file: *backend_env_files
    # depends_on:
    #   llama-server:
    #     condition: service_healthy
    networks:
      - appnet
    # Resource limits: Crawler + scheduler (moderate CPU during scraping)
    cpus: "1.0"
    mem_limit: "512m"
    pids_limit: 300

  pension-rebalancer:
    image: *backend_image
    container_name: myasset-pension-rebalancer
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./backend/storage:/app/backend/storage
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
      - ${MYASSET_SECRETS_ENV_FILE:-/home/dlckdgn/ai-models/myasset.secrets.env}:/app/runtime/myasset.secrets.env
      - ${KIS_CONFIG_DIR:-/home/dlckdgn/KIS/config}:/root/KIS/config
    command: python -m backend.scripts.run_pension_rebalance_scheduler
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Seoul
      - MYASSET_SECRETS_ENV_FILE=/app/runtime/myasset.secrets.env
      - PENSION_REBALANCE_EXECUTE=${PENSION_REBALANCE_EXECUTE:-1}
      - PENSION_REBALANCE_RUN_ON_START=${PENSION_REBALANCE_RUN_ON_START:-0}
      - PENSION_REBALANCE_FORCE_START=${PENSION_REBALANCE_FORCE_START:-0}
      - PENSION_REBALANCE_HOUR=${PENSION_REBALANCE_HOUR:-10}
      - PENSION_REBALANCE_MINUTE=${PENSION_REBALANCE_MINUTE:-5}
      - PENSION_REBALANCE_QUARTER_WINDOW_DAYS=${PENSION_REBALANCE_QUARTER_WINDOW_DAYS:-7}
      - PENSION_REBALANCE_STATE_PATH=${PENSION_REBALANCE_STATE_PATH:-/app/backend/storage/pension_rebalance/state.json}
      - PENSION_REBALANCE_MIN_ORDER_AMOUNT=${PENSION_REBALANCE_MIN_ORDER_AMOUNT:-50000}
      - PENSION_CASH_SWEEP_EXECUTE=${PENSION_CASH_SWEEP_EXECUTE:-1}
      - PENSION_CASH_SWEEP_RUN_ON_START=${PENSION_CASH_SWEEP_RUN_ON_START:-0}
      - PENSION_CASH_SWEEP_HOUR=${PENSION_CASH_SWEEP_HOUR:-10}
      - PENSION_CASH_SWEEP_MINUTE=${PENSION_CASH_SWEEP_MINUTE:-15}
      - PENSION_CASH_SWEEP_MIN_ORDER_AMOUNT=${PENSION_CASH_SWEEP_MIN_ORDER_AMOUNT:-15000}
      - PENSION_CASH_SWEEP_LUMP_SUM_THRESHOLD=${PENSION_CASH_SWEEP_LUMP_SUM_THRESHOLD:-6000000}
    env_file: *backend_env_files
    networks:
      - appnet
    cpus: "0.5"
    mem_limit: "384m"
    pids_limit: 200

  esports-monitor:
    image: *backend_image
    container_name: myasset-esports-monitor
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./backend/storage:/app/backend/storage
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
      - /mnt/one-touch:/mnt/one-touch
    command: python -m backend.scripts.manage listen-esports
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Seoul
    env_file: *backend_env_files
    networks:
      - appnet
    # Resource limits: Light monitoring service
    cpus: "0.50"
    mem_limit: "256m"
    pids_limit: 200

  sync-prices:
    image: *backend_image
    container_name: myasset-sync-prices
    restart: always
    volumes:
      - ./backend:/app/backend
      - ./backend/storage:/app/backend/storage
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
      - ${KIS_CONFIG_DIR:-/home/dlckdgn/KIS/config}:/root/KIS/config
      - /mnt/one-touch:/mnt/one-touch
    command: python -m backend.scripts.runners.run_sync_prices_scheduler
    environment:
      - PYTHONPATH=/app
      - BACKEND_URL=http://backend-api:8000
      - LLM_BASE_URL=http://llama-server-sycl-huihui:8084
      - AI_REPORT_MODEL=gpt-5.6-sol
      - AI_REPORT_TIMEOUT_SEC=900
      - LLM_REMOTE_DEFAULT_MODEL=supergemma4-Q8_0.gguf
      - TZ=Asia/Seoul
    env_file: *backend_env_files
    # depends_on:
    #   llama-server:
    #     condition: service_healthy
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - appnet
    # Resource limits: Scheduler + LLM calls (needs more resources)
    cpus: "1.5"
    mem_limit: "768m"
    pids_limit: 400

networks:
  appnet:
    driver: bridge
