x-backend-env-files: &backend_env_files
  - ./backend/.env
  - ${MYASSET_SECRETS_ENV_FILE:-/home/dlckdgn/ai-models/myasset.secrets.env}

x-backend-image: &backend_image personal-portfolio-backend:latest

x-backend-build: &backend_build
  context: ./backend
  dockerfile: Dockerfile

x-comfyui-gdrive-sync-image: &comfyui_gdrive_sync_image personal-portfolio-comfyui-gdrive-sync:latest

services:
  # Deprecated SYCL backend. Keep commented out unless we explicitly revive it.
